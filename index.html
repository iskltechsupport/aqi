<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: transparent !important;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .wrap { width: 100%; max-width: 460px; background: transparent; }
  .title {
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,.35);
    margin-bottom: 14px;
  }
  /* No white anywhere: the whole card is one colored surface (gradient band + a
     solid darker-shade footer), sitting directly on the transparent page. */
  .card {
    width: 100%;
    background: transparent;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 14px 30px rgba(0,0,0,.22);
  }
  .band {
    padding: 18px 20px 16px;
    color: #fff;
    background: #94a3b8; /* fallback, overwritten via JS per AQI category */
    transition: background .4s ease;
  }
  .row-top { display: flex; align-items: center; gap: 14px; }
  .aqi-box {
    background: rgba(255,255,255,.24);
    border-radius: 14px;
    padding: 8px 16px;
    text-align: center;
    min-width: 62px;
  }
  .aqi-box .n { font-size: 26px; font-weight: 800; line-height: 1; }
  .aqi-box .u { font-size: 9px; font-weight: 700; letter-spacing: .4px; opacity: .9; margin-top: 3px; }
  .status { font-size: 21px; font-weight: 700; flex: 1; }
  .face { width: 60px; height: 60px; flex-shrink: 0; object-fit: contain; }
  .divider { height: 1px; background: rgba(255,255,255,.28); margin: 14px 0 12px; }
  .poll {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 14px; opacity: .95;
  }
  .poll .c { font-size: 15px; font-weight: 700; }
  .foot {
    display: flex; justify-content: space-around; align-items: center;
    padding: 14px 10px; color: #fff; background: #7c8896; /* fallback, overwritten via JS (colorDark) */
    transition: background .4s ease;
  }
  .foot .m { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }
  .foot svg { width: 17px; height: 17px; flex-shrink: 0; }
  .err { padding: 30px 20px; text-align: center; color: #fff; font-size: 14px; background: rgba(192,57,43,.85); border-radius: 22px; }
  .fade { opacity: .35; transition: opacity .3s; }
</style>
</head>

  // Fallback palette in case data.json is missing colorDark/level (e.g. very first
  // load before the Action has run once).
  function categoryFallback(aqi) {
    if (aqi <= 50)  return { color: '#2ECC71', colorDark: '#1E9E5A', level: 1, key: 'good' };
    if (aqi <= 100) return { color: '#F1C40F', colorDark: '#D4A017', level: 2, key: 'moderate' };
    if (aqi <= 150) return { color: '#E67E22', colorDark: '#C36A16', level: 3, key: 'usg' };
    if (aqi <= 200) return { color: '#F1595C', colorDark: '#D6394B', level: 4, key: 'unhealthy' };
    if (aqi <= 300) return { color: '#9B59B6', colorDark: '#7D3C98', level: 5, key: 'very_unhealthy' };
    return                 { color: '#7E1E2B', colorDark: '#5C1420', level: 6, key: 'hazardous' };
  }
  var LEVEL_KEY = { 1: 'good', 2: 'moderate', 3: 'usg', 4: 'unhealthy', 5: 'very_unhealthy', 6: 'hazardous' };

  function render(d) {
    var body = document.getElementById('body');
    if (d.error) {
      body.innerHTML = '<div class="err">⚠ ' + d.error + '</div>';
      return;
    }
    var fb = categoryFallback(d.aqi);
    var color = d.color || fb.color;
    var colorDark = d.colorDark || fb.colorDark;
    var level = d.level || fb.level;
    var key = LEVEL_KEY[level] || fb.key;

    set('title', (d.city || 'Local') + ' air quality index (AQI)');
    set('aqi', d.aqi);
    set('status', d.label);
    set('poll', d.pollutant);
    set('conc', d.conc != null ? d.conc + ' µg/m³' : '');
    set('temp', d.temp + '°');
    set('wind', d.wind + ' km/h');
    set('hum', d.humidity + ' %');

    document.getElementById('band').style.background =
      'linear-gradient(135deg, ' + color + ', ' + colorDark + ')';
    document.getElementById('foot').style.background = colorDark;

    document.getElementById('face').src = FACES[key];
  }
  function set(id, v) { var e = document.getElementById(id); if (e) e.textContent = v; }

  // Static-site version: read the JSON file a GitHub Action refreshes every
  // ~10 min, instead of calling a server (google.script.run) directly.
  function load() {
    document.getElementById('card').classList.add('fade');
    fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){ render(d); done(); })
      .catch(function(e){ render({error: 'Could not load data.json — ' + e.message}); done(); });
  }
  function done(){ document.getElementById('card').classList.remove('fade'); }

  load();
  setInterval(load, REFRESH_MS);
</script>
