<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISKL Air Quality</title>
<style>
  :root {
    --navy: #1C4E8F;
    --navy-d: #1B3A6B;
    --gold: #F5C400;
    --gold-d: #C9A84C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .card {
    width: 100%; max-width: 460px;
    background: #fff; border-radius: 20px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(27,58,107,.18);
    border: 1px solid rgba(27,58,107,.08);
  }
  .head {
    background: linear-gradient(135deg, var(--navy), var(--navy-d));
    color: #fff; padding: 16px 20px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 3px solid var(--gold);
  }
  .head h1 { font-size: 17px; font-weight: 700; letter-spacing: .2px; }
  .head .loc { font-size: 12px; opacity: .8; margin-left: auto; }
  .band {
    padding: 20px; color: #fff; position: relative;
    transition: background .4s ease;
  }
  .aqi-row { display: flex; align-items: center; gap: 16px; }
  .aqi-box {
    background: rgba(255,255,255,.22); border-radius: 12px;
    padding: 10px 14px; text-align: center; min-width: 78px;
  }
  .aqi-box .n { font-size: 30px; font-weight: 800; line-height: 1; }
  .aqi-box .u { font-size: 9px; font-weight: 700; letter-spacing: .5px; opacity: .9; margin-top: 4px; }
  .status { font-size: 24px; font-weight: 700; }
  .face { margin-left: auto; width: 62px; height: 62px; flex: 0 0 62px; }
  .face svg { width: 100%; height: 100%; display: block; }
  .poll {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 18px; font-size: 15px;
  }
  .poll .c { font-size: 22px; font-weight: 700; }
  .foot {
    display: flex; justify-content: space-around; align-items: center;
    padding: 14px 20px; color: var(--navy-d); background: #fff;
  }
  .foot .m { display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 600; }
  .foot svg { width: 18px; height: 18px; fill: none; stroke: var(--gold-d); stroke-width: 2; }
  .stamp { text-align: center; font-size: 10px; color: #9aa5b1; padding: 6px 0 10px; }
  .err { padding: 30px 20px; text-align: center; color: #c0392b; font-size: 14px; }
  .fade { opacity: .35; transition: opacity .3s; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="head">
      <h1>Air Quality Index (AQI)</h1>
      <span class="loc" id="loc"></span>
    </div>
    <div id="body">
      <div class="band" id="band" style="background:#94a3b8">
        <div class="aqi-row">
          <div class="aqi-box"><div class="n" id="aqi">&mdash;</div><div class="u">US AQI</div></div>
          <div class="status" id="status">Loading&hellip;</div>
          <div class="face" id="face"></div>
        </div>
        <div class="poll">
          <span>Main pollutant: <b id="poll">&mdash;</b></span>
          <span class="c" id="conc"></span>
        </div>
      </div>
      <div class="foot">
        <div class="m">
          <svg viewBox="0 0 24 24"><path d="M4 15a4 4 0 010-8 5 5 0 019.6-1.5A4.5 4.5 0 1119 15H4z"/></svg>
          <span id="temp">&mdash;</span>
        </div>
        <div class="m">
          <svg viewBox="0 0 24 24"><path d="M3 12l18-8-6 18-3-7-9-3z"/></svg>
          <span id="wind">&mdash;</span>
        </div>
        <div class="m">
          <svg viewBox="0 0 24 24"><path d="M12 3s6 7 6 11a6 6 0 11-12 0c0-4 6-11 6-11z"/></svg>
          <span id="hum">&mdash;</span>
        </div>
      </div>
      <div class="stamp" id="stamp"></div>
    </div>
  </div>

<script>
  // -- CONFIG -----------------------------------------------
  // Paste your Apps Script Web App /exec URL here (Deploy > Web app).
  var GAS_URL = "https://script.google.com/macros/s/AKfycbxpQc6MsYByj1KaWL7sxtJNiIHsjf7tNfhPRCwWRmMVOTsfCNBfr3HnJtJy0rgvoH021g/exec";
  var REFRESH_MS = 10 * 60 * 1000; // 10 min
  // ---------------------------------------------------------

  // Bearded IQAir-style character, tinted onto the band (tone-on-tone).
  // Masked for Unhealthy+; smiling/unmasked when air is cleaner.
  function faceSVG(aqi) {
    var L  = 'rgba(0,0,0,.20)';   // main lines (darker shade of band)
    var B  = 'rgba(0,0,0,.13)';   // beard/hair fill
    var Mf = 'rgba(255,255,255,.30)'; // mask fill
    var Pl = 'rgba(0,0,0,.12)';   // mask pleats

    // shared features
    var hair = '<path d="M32 33 C33 21 67 21 68 33 C71 29 67 22 58 20 C49 17 39 18 35 23 C31 26 30 30 32 33 Z" fill="'+B+'"/>';
    var head = '<path d="M32 33 C30 45 31 55 36 62 C40 68 45 72 50 72 C55 72 60 68 64 62 C69 55 70 45 68 33" fill="none" stroke="'+L+'" stroke-width="2.4" stroke-linecap="round"/>';
    var ears = '<path d="M31 43 C28 43 28 49 31 49" fill="none" stroke="'+L+'" stroke-width="2.2" stroke-linecap="round"/>'
             + '<path d="M69 43 C72 43 72 49 69 49" fill="none" stroke="'+L+'" stroke-width="2.2" stroke-linecap="round"/>';
    var beard = '<path d="M33 49 C33 60 39 68 47 71 C43 68 40 62 39 55 C38 52 36 50 33 49 Z" fill="'+B+'"/>'
              + '<path d="M67 49 C67 60 61 68 53 71 C57 68 60 62 61 55 C62 52 64 50 67 49 Z" fill="'+B+'"/>';
    var nose = '<path d="M50 47 L50 53" fill="none" stroke="'+L+'" stroke-width="2" stroke-linecap="round"/>';

    // brow variants
    var brow;
    if (aqi <= 150)      brow = '<path d="M38 40 C41 38 44 38 46 40" fill="none" stroke="'+L+'" stroke-width="2.2" stroke-linecap="round"/><path d="M54 40 C56 38 59 38 62 40" fill="none" stroke="'+L+'" stroke-width="2.2" stroke-linecap="round"/>';
    else if (aqi <= 300) brow = '<path d="M38 41 L46 38" fill="none" stroke="'+L+'" stroke-width="2.2" stroke-linecap="round"/><path d="M62 41 L54 38" fill="none" stroke="'+L+'" stroke-width="2.2" stroke-linecap="round"/>'; // worried (inner up)
    else                 brow = '<path d="M38 38 L46 41" fill="none" stroke="'+L+'" stroke-width="2.4" stroke-linecap="round"/><path d="M62 38 L54 41" fill="none" stroke="'+L+'" stroke-width="2.4" stroke-linecap="round"/>'; // angry (inner down)

    var eyes = '<path d="M39 45 C41 47 44 47 46 45" fill="none" stroke="'+L+'" stroke-width="2.2" stroke-linecap="round"/>'
             + '<path d="M54 45 C56 47 59 47 61 45" fill="none" stroke="'+L+'" stroke-width="2.2" stroke-linecap="round"/>';

    if (aqi <= 100) {
      // clean-ish air: no mask, smile, happy eyes
      var happyEyes = '<path d="M39 46 C41 44 44 44 46 46" fill="none" stroke="'+L+'" stroke-width="2.2" stroke-linecap="round"/>'
                    + '<path d="M54 46 C56 44 59 44 61 46" fill="none" stroke="'+L+'" stroke-width="2.2" stroke-linecap="round"/>';
      var smile = '<path d="M42 59 C46 64 54 64 58 59" fill="none" stroke="'+L+'" stroke-width="2.4" stroke-linecap="round"/>';
      return svgWrap(hair + head + ears + beard
        + '<path d="M38 40 C41 38.5 44 38.5 46 40" fill="none" stroke="'+L+'" stroke-width="2.2" stroke-linecap="round"/>'
        + '<path d="M54 40 C56 38.5 59 38.5 62 40" fill="none" stroke="'+L+'" stroke-width="2.2" stroke-linecap="round"/>'
        + happyEyes + nose + smile);
    }

    // masked face (Unhealthy and worse)
    var mask = '<path d="M36 55 C40 52 60 52 64 55 C66 60 65 66 60 70 C56 73 44 73 40 70 C35 66 34 60 36 55 Z" fill="'+Mf+'" stroke="'+L+'" stroke-width="2.4" stroke-linejoin="round"/>'
             + '<path d="M36 56 L30 52" fill="none" stroke="'+L+'" stroke-width="2.2" stroke-linecap="round"/>'
             + '<path d="M64 56 L70 52" fill="none" stroke="'+L+'" stroke-width="2.2" stroke-linecap="round"/>'
             + '<path d="M39 61 H61" stroke="'+Pl+'" stroke-width="1.6"/>'
             + '<path d="M40 65 H60" stroke="'+Pl+'" stroke-width="1.6"/>';

    return svgWrap(hair + head + ears + beard + brow + eyes + nose + mask);
  }

  function svgWrap(inner) {
    return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' + inner + '</svg>';
  }

  function render(d) {
    var body = document.getElementById('body');
    if (!d || d.error) {
      body.innerHTML = '<div class="err">\u26A0 ' + ((d && d.error) || 'No data') + '</div>';
      return;
    }
    set('loc', d.city || '');
    set('aqi', d.aqi);
    set('status', d.label);
    set('poll', d.pollutant);
    set('conc', d.conc != null ? d.conc + ' \u00B5g/m\u00B3' : '');
    set('temp', d.temp + '\u00B0');
    set('wind', d.wind + ' km/h');
    set('hum', d.humidity + ' %');
    var band = document.getElementById('band');
    if (band) band.style.background = d.color;
    var face = document.getElementById('face');
    if (face) face.innerHTML = faceSVG(Number(d.aqi));
    var t = new Date(d.updated);
    set('stamp', 'Updated ' + t.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + ' \u00B7 IQAir');
  }
  function set(id, v) { var e = document.getElementById(id); if (e) e.textContent = v; }
  function done() { var c = document.getElementById('card'); if (c) c.classList.remove('fade'); }

  // JSONP: sidesteps CORS entirely for a GAS web-app GET.
  function load() {
    var card = document.getElementById('card');
    if (card) card.classList.add('fade');

    var cbName = 'aqiCb_' + Date.now();
    var script = document.createElement('script');

    var timer = setTimeout(function () {
      cleanup();
      render({ error: 'Request timed out' });
      done();
    }, 15000);

    function cleanup() {
      clearTimeout(timer);
      try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = function (d) { cleanup(); render(d); done(); };
    script.onerror = function () { cleanup(); render({ error: 'Fetch failed' }); done(); };
    script.src = GAS_URL + '?callback=' + cbName + '&_=' + Date.now();
    document.head.appendChild(script);
  }

  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
