<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISKL Air Quality</title>
<style>
  :root {
    --navy: #1C4E8F;
    --navy-d: #1B3A6B;
    --gold: #F5C400;
    --gold-d: #C9A84C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .wrap { width: min(94vw, 860px); }
  .title {
    text-align: center;
    color: #fff;
    font-weight: 800;
    font-size: clamp(22px, 3.4vw, 40px);
    letter-spacing: .2px;
    margin-bottom: clamp(14px, 2vw, 24px);
  }
  .card {
    width: 100%;
    background: #fff;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 14px 40px rgba(27,58,107,.18);
    border: 1px solid rgba(27,58,107,.06);
  }
  .band {
    padding: clamp(20px, 3vw, 34px) clamp(22px, 3.5vw, 40px);
    color: #fff;
    transition: background .4s ease;
  }
  .aqi-row { display: flex; align-items: center; gap: clamp(16px, 3vw, 32px); }
  .aqi-box {
    background: rgba(255,255,255,.20);
    border-radius: 16px;
    padding: clamp(10px,1.4vw,16px) clamp(14px,1.8vw,22px);
    text-align: center;
    min-width: clamp(96px, 12vw, 128px);
  }
  .aqi-box .n { font-size: clamp(34px, 5.4vw, 60px); font-weight: 800; line-height: .95; }
  .aqi-box .u { font-size: clamp(10px, 1.2vw, 14px); font-weight: 700; letter-spacing: .5px; opacity: .9; margin-top: 6px; }
  .status { font-size: clamp(26px, 4.6vw, 52px); font-weight: 700; flex: 1; }
  .face { width: clamp(64px, 9vw, 104px); height: clamp(64px, 9vw, 104px); flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
  .face img { max-width: 100%; max-height: 100%; opacity: .30; }
  .divider { height: 1px; background: rgba(255,255,255,.35); margin: clamp(16px,2.4vw,26px) 0; }
  .poll {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: clamp(16px, 2.4vw, 28px);
  }
  .poll .c { font-size: clamp(20px, 3vw, 34px); font-weight: 700; }
  .foot {
    display: flex; justify-content: space-around; align-items: center;
    padding: clamp(14px,2vw,22px) clamp(22px,3.5vw,40px);
    background: #fff;
  }
  .foot .m { display: flex; align-items: center; gap: clamp(7px,1vw,12px); font-size: clamp(16px,2.4vw,28px); font-weight: 600; color: var(--navy-d); }
  .foot svg { width: clamp(20px,2.6vw,30px); height: clamp(20px,2.6vw,30px); fill: none; stroke-width: 2; }
  .i-temp { stroke: #9aa5b1; }
  .i-wind { stroke: var(--navy-d); }
  .i-hum  { stroke: #3b82f6; }
  .stamp { text-align: center; font-size: clamp(11px,1.3vw,14px); color: #9aa5b1; margin-top: 14px; letter-spacing: .3px; }
  .err { padding: 40px 20px; text-align: center; color: #c0392b; font-size: 16px; }
  .fade { opacity: .4; transition: opacity .3s; }
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="title" id="title">Kuala Lumpur air quality index (AQI)</div>
    <div class="card" id="card">
      <div id="body">
        <div class="band" id="band" style="background:#94a3b8">
          <div class="aqi-row">
            <div class="aqi-box"><div class="n" id="aqi">&mdash;</div><div class="u">US AQI</div></div>
            <div class="status" id="status">Loading&hellip;</div>
            <div class="face" id="face"></div>
          </div>
          <div class="divider"></div>
          <div class="poll">
            <span>Main pollutant: <b id="poll">&mdash;</b></span>
            <span class="c" id="conc"></span>
          </div>
        </div>
        <div class="foot">
          <div class="m">
            <svg class="i-temp" viewBox="0 0 24 24"><path d="M4 15a4 4 0 010-8 5 5 0 019.6-1.5A4.5 4.5 0 1119 15H4z"/></svg>
            <span id="temp">&mdash;</span>
          </div>
          <div class="m">
            <svg class="i-wind" viewBox="0 0 24 24"><path d="M3 12l18-8-6 18-3-7-9-3z"/></svg>
            <span id="wind">&mdash;</span>
          </div>
          <div class="m">
            <svg class="i-hum" viewBox="0 0 24 24"><path d="M12 3s6 7 6 11a6 6 0 11-12 0c0-4 6-11 6-11z"/></svg>
            <span id="hum">&mdash;</span>
          </div>
        </div>
      </div>
    </div>
    <div class="stamp" id="stamp"></div>
  </div>

  function faceFor(aqi) {
    if (aqi <= 50)  return FACES.happy;   // Good
    if (aqi <= 100) return FACES.neutral; // Moderate
    if (aqi <= 150) return FACES.sad;     // USG
    return FACES.masked;                  // Unhealthy and worse
  }

  function render(d) {
    var body = document.getElementById('body');
    if (!d || d.error) {
      body.innerHTML = '<div class="err">\u26A0 ' + ((d && d.error) || 'No data') + '</div>';
      return;
    }
    var city = d.city || 'Kuala Lumpur';
    set('title', city + ' air quality index (AQI)');
    set('aqi', d.aqi);
    set('status', d.label);
    set('poll', d.pollutant);
    set('conc', d.conc != null ? d.conc + ' \u00B5g/m\u00B3' : '');
    set('temp', d.temp + '\u00B0');
    set('wind', d.wind + ' km/h');
    set('hum', d.humidity + ' %');
    var band = document.getElementById('band');
    if (band) band.style.background = d.color;
    var face = document.getElementById('face');
    if (face) face.innerHTML = '<img alt="" src="' + faceFor(Number(d.aqi)) + '">';
    var t = new Date(d.updated);
    set('stamp', 'Updated ' + t.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + ' \u00B7 IQAir');
  }
  function set(id, v) { var e = document.getElementById(id); if (e) e.textContent = v; }
  function done() { var c = document.getElementById('card'); if (c) c.classList.remove('fade'); }

  // JSONP: sidesteps CORS entirely for a GAS web-app GET.
  function load() {
    var card = document.getElementById('card');
    if (card) card.classList.add('fade');

    var cbName = 'aqiCb_' + Date.now();
    var script = document.createElement('script');

    var timer = setTimeout(function () {
      cleanup();
      render({ error: 'Request timed out' });
      done();
    }, 15000);

    function cleanup() {
      clearTimeout(timer);
      try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = function (d) { cleanup(); render(d); done(); };
    script.onerror = function () { cleanup(); render({ error: 'Fetch failed' }); done(); };
    script.src = GAS_URL + '?callback=' + cbName + '&_=' + Date.now();
    document.head.appendChild(script);
  }

  load();
  setInterval(load, REFRESH_MS);
</script>
